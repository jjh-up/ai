<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern AI Chatbot Assistant">
    <meta name="theme-color" content="#ffffff">
    <title>AI 챗봇 어시스턴트</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        height: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        border-radius: 16px;
        overflow: hidden;
        background: #ffffff;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      .header-content {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-icon {
        font-size: 28px;
        animation: pulse 2s ease-in-out infinite;
      }

      .header-text h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
      }

      .header-text p {
        font-size: 12px;
        opacity: 0.9;
        margin-top: 2px;
      }

      .status-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: #4ade80;
        border-radius: 50%;
        animation: blink 2s ease-in-out infinite;
      }

      .chat-wrapper {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      .footer {
        background: #f8f9fa;
        padding: 12px 24px;
        border-top: 1px solid #e9ecef;
        font-size: 12px;
        color: #6c757d;
        text-align: center;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .header {
          padding: 16px 20px;
        }

        .header-text h1 {
          font-size: 18px;
        }

        .container {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 헤더 -->
      <div class="header">
        <div class="header-content">
          <div class="header-icon">🤖</div>
          <div class="header-text">
            <h1>AI 어시스턴트</h1>
            <p>24/7 스마트 채팅 서비스</p>
          </div>
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>온라인</span>
        </div>
      </div>

      <!-- 챗봇 iframe -->
      <div class="chat-wrapper">
        <iframe 
          src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/cr470_multimodelaiagent_smENVx/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
          title="AI Chatbot"
          allow="microphone; camera">
        </iframe>
      </div>

      <!-- 푸터 -->
      <div class="footer">
        ✨ 최신 AI 기술로 구동되는 스마트 어시스턴트 | 모든 대화는 안전하게 보호됩니다
      </div>
    </div>
  </body>
</html>
